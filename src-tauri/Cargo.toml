[workspace]
members = [".", "crates/sshastra-core"]
exclude = ["vendor/russh"]
resolver = "2"

[patch.crates-io]
# Observe automatic keepalive replies. See vendor/russh/SSH-ASTRA.md.
russh = { path = "vendor/russh" }

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/amemiya02/ssh-astra"

[workspace.dependencies]
sshastra-core = { path = "crates/sshastra-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# Decrypting a passphrase-protected key (bcrypt-pbkdf) takes many seconds
# unoptimized; keep it fast in dev builds and tests.
[profile.dev.package.bcrypt-pbkdf]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# The Tauri app crate: a thin IPC bridge over `sshastra-core`.
[package]
name = "sshastra"
description = "A modern desktop SSH/SFTP client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "sshastra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.7"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
chrono = { version = "0.4", default-features = false, features = ["now"] }
log = { workspace = true, features = ["std"] }
png = "0.18"
regex = "1"
sshastra-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
# In-app updates from GitHub Releases, and the relaunch after installing one.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tempfile = "3"
whoami = { version = "2", default-features = false, features = ["std"] }
# Test-only: an embedded WebDriver server for the E2E smoke test (`e2e/`).
# Never in release builds (see the `e2e` feature).
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
percent-encoding = "2"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent",
    "NSFilePromiseProvider", "NSImage", "NSPasteboard", "NSResponder", "NSView", "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSDictionary", "NSError", "NSGeometry",
    "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_Marshal",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gtk = "0.18"
libloading = "0.7"
zbus = "5"

[features]
# The E2E build (`pnpm e2e:build`): embeds the WebDriver server and keeps
# credentials out of the system keychain. `lib.rs` refuses it in release builds.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
