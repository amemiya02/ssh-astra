[workspace]
members = [".", "crates/sshastra-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/amemiya02/ssh-astra"

[workspace.dependencies]
sshastra-core = { path = "crates/sshastra-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The Tauri app crate: a thin IPC bridge over `sshastra-core`.
[package]
name = "sshastra"
description = "A modern desktop SSH/SFTP client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "sshastra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sshastra-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
