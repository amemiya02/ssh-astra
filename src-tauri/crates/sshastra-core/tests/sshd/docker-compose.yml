# OpenSSH servers for sshastra's integration tests. Started on demand by
# `tests/support/mod.rs`; see CLAUDE.md ("Integration tests").
#
#   ssh       reachable from the test process (published on a random
#             loopback port): the plain target.
#   jump      reachable from the test process and from the private network:
#             a Jump host.
#   internal  on the private network only: reachable only through `jump`
#             (as `internal:22`).
#   keyonly   published: accepts public keys only (no password, no
#             keyboard-interactive).
#   kbdint    published: keyboard-interactive (PAM asks for the password)
#             instead of the password method, either alone or as the second
#             step after a public key ("partial success").
#
# Add services here (e.g. a TCP echo server for Port forward tests) rather
# than starting containers from individual tests.
name: sshastra-it

x-sshd: &sshd
  build: .
  image: sshastra-it-sshd

services:
  ssh:
    <<: *sshd
    ports: ["127.0.0.1::22"]
    networks: [public]
  jump:
    <<: *sshd
    ports: ["127.0.0.1::22"]
    networks: [public, private]
  internal:
    <<: *sshd
    networks: [private]
  keyonly:
    <<: *sshd
    ports: ["127.0.0.1::22"]
    networks: [public]
    command: [/usr/sbin/sshd, -D, -e, -o, PasswordAuthentication=no, -o, KbdInteractiveAuthentication=no]
  kbdint:
    <<: *sshd
    ports: ["127.0.0.1::22"]
    networks: [public]
    command:
      - /usr/sbin/sshd
      - -D
      - -e
      - -o
      - PasswordAuthentication=no
      - -o
      - KbdInteractiveAuthentication=yes
      - -o
      - AuthenticationMethods=publickey,keyboard-interactive keyboard-interactive

networks:
  public: {}
  private:
    internal: true
