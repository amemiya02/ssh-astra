[package]
name = "sshastra-core"
description = "Domain logic for sshastra. Must not depend on Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
hmac = "0.13"
keyring = "4"
portable-pty = "0.9"
# `ring` instead of the default aws-lc-rs: no cmake/NASM needed on any platform.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
vt100 = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
