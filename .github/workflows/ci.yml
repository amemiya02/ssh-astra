name: CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Lint (front end)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (Rust)
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: sshastra-core must not depend on Tauri
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          if cargo tree -p sshastra-core -e normal --prefix none | grep -E '^tauri'; then
            echo "sshastra-core depends on Tauri" >&2
            exit 1
          fi

      - name: Test (Rust)
        working-directory: src-tauri
        # Docker OpenSSH integration tests run on Linux only (macOS runners
        # have no Docker; Windows runners have no Linux containers).
        env:
          SSHASTRA_DOCKER_TESTS: ${{ runner.os == 'Linux' && 'require' || 'skip' }}
          SSHASTRA_IT_PROJECT: sshastra-it-ci
        run: cargo test --workspace
      - name: Stop test containers
        if: always() && runner.os == 'Linux'
        env:
          SSHASTRA_IT_PROJECT: sshastra-it-ci
        run: docker compose -p sshastra-it-ci -f src-tauri/crates/sshastra-core/tests/sshd/docker-compose.yml down --volumes
      - name: Test (front end)
        run: pnpm test

      - name: Build app
        run: pnpm tauri build --debug --no-bundle

  e2e:
    name: E2E smoke (ubuntu-22.04)
    runs-on: ubuntu-22.04
    env:
      # Its own Compose project, so it never shares containers with `check`.
      SSHASTRA_IT_PROJECT: sshastra-it-e2e
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: e2e

      - run: pnpm install --frozen-lockfile

      - name: Build the E2E app (debug, `e2e` feature)
        run: pnpm e2e:build

      - name: E2E smoke test
        # Runs the smoke test three times in a row: it must pass every time.
        # The session bus keeps single-instance forwarding active under Xvfb.
        run: |
          for attempt in 1 2 3; do
            echo "::group::E2E run $attempt"
            dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" pnpm e2e
            echo "::endgroup::"
          done

      - name: Upload E2E screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          if-no-files-found: ignore

      - name: Stop test containers
        if: always()
        run: docker compose -p sshastra-it-e2e -f src-tauri/crates/sshastra-core/tests/sshd/docker-compose.yml down --volumes
